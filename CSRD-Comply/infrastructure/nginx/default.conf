# CSRD Comply — Nginx Configuration
# Reverse proxy per il deployment SaaS multi-tenant
#
# Gestisce:
#   - Routing delle richieste API (backend FastAPI)
#   - Static files / frontend (Next.js)
#   - SSL termination
#   - Rate limiting per tenant
#   - Health check per il backend

upstream backend {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
}

# ── Rate Limiting Zones ────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=100r/m;
limit_req_zone $http_x_tenant_id zone=api_per_tenant:10m rate=500r/m;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;

# ── HTTP → HTTPS Redirect ──────────────────────────────────────

server {
    listen 80;
    server_name csrdcomply.io api.csrdcomply.io *.csrdcomply.io;
    return 301 https://$server_name$request_uri;
}

# ── HTTPS Main ──────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name csrdcomply.io;

    ssl_certificate /etc/nginx/ssl/csrdcomply.crt;
    ssl_certificate_key /etc/nginx/ssl/csrdcomply.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Backend API — con rate limiting specifico per auth
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;

        # Rate limiting per IP (100 req/min)
        limit_req zone=api_per_ip burst=150 nodelay;
        limit_req_status 429;

        # CORS headers for API
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Tenant-ID" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Stricter rate limiting per auth endpoints
        location ~* ^/api/v1/auth/(login|register) {
            limit_req zone=auth_per_ip burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
        }

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Health check — passa al backend per risposta reale
    location /health {
        proxy_pass http://backend/health;
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ── API Subdomain ──────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name api.csrdcomply.io;

    ssl_certificate /etc/nginx/ssl/csrdcomply.crt;
    ssl_certificate_key /etc/nginx/ssl/csrdcomply.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limiting
        limit_req zone=api_per_ip burst=200 nodelay;
        limit_req_status 429;
    }

    location /docs {
        proxy_pass http://backend/docs;
    }

    location /openapi.json {
        proxy_pass http://backend/openapi.json;
    }
}
