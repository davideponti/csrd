version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: csrd_comply
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "127.0.0.1:5432:5432"  # ← Solo localhost!
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/csrd_comply
      ENVIRONMENT: production
      SECRET_KEY_FILE: /run/secrets/secret_key
      CORS_ORIGINS: '["https://csrdcomply.com"]'
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - db_password
      - secret_key
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      # ⚠️ NON impostare NEXT_PUBLIC_API_URL qui!
      # In Docker con Nginx in fronte, frontend e backend sono sullo
      # stesso dominio. L'API client usa il percorso relativo /api/v1
      # come fallback, e Nginx proxy /api/ → backend.
      # HttpOnly cookie JWT funzionano solo se browser→Nginx→Backend
      # sono tutti sulla stessa origine.
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

secrets:
  db_password:
    file: ./secrets/db_password.txt
  secret_key:
    file: ./secrets/secret_key.txt

volumes:
  pgdata:
